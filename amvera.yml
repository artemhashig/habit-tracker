# Python-окружение: uvicorn раздаёт API и собранный фронтенд.
# Фронт собирается локально (npm run build) и коммитится в git (frontend/dist).
meta:
  environment: python
  toolchain:
    name: pip
    version: 3.11
run:
  command: uvicorn --host 0.0.0.0 --port 80 main:app
  persistenceMount: /data
  containerPort: 80
